services:
  mysql:
    image: postgres:18.6
    container_name: e-commerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spring
      POSTGRES_PASSWORD: spring
      POSTGRES_DB: spring
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  cache:
    image: redis:7.4.11
    container_name: e-commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cache-data:/data

