services:
  mysql:
    image: postgres:18.6
    container_name: e-commerce-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spring
      POSTGRES_PASSWORD: spring
      POSTGRES_DB: spring
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  cache:
    image: redis:7.4.11
    container_name: e-commerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - cache-data:/data

  rabbitmq:
    image: rabbitmq:4.2.9-management
    container_name: e-commerce-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  elasticsearch:
    image: elasticsearch:9.4.6
    container_name: e-commerce-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

